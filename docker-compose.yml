services:
  api:
    build: ./backend
    environment:
      - ACESSOMAP_DATA_DIR=/app/data
    volumes:
      - acessomap-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  acessomap-data:
